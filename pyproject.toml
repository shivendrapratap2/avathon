[build-system]
requires = ["setuptools>=75.6,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "avathon-supply-chain-agents"
version = "0.1.0"
description = "Auditable multi-agent supply-chain disruption triage"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

