[build-system]
requires = ["setuptools>=75.6"]
build-backend = "setuptools.build_meta"

[project]
name = "avathon-supply-chain-agents"
version = "0.2.0"
description = "GPT-planned, policy-bounded supply-chain disruption triage"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
